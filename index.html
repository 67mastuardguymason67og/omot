<html lang="en">

  <style>
    :root {
      --bg: #0a0a0f;
      --surface: #13131a;
      --surface2: #1c1c28;
      --accent: #d321ff;
      --accent2: #ff3cac;
      --text: #e8e8f0;
      --muted: #6b6b88;
      --border: #2a2a3d;
      --user-bubble: #1a2a1f;
      --bot-bubble: #1a1a2e;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      background: var(--bg);
      color: var(--text);
      font-family: 'Syne', sans-serif;
      height: 100vh;
      display: flex;
      flex-direction: column;
      overflow: hidden;
    }

    body::before {
      content: '';
      position: fixed;
      inset: 0;
      background-image:
        linear-gradient(rgba(0,255,136,0.03) 1px, transparent 1px),
        linear-gradient(90deg, rgba(0,255,136,0.03) 1px, transparent 1px);
      background-size: 40px 40px;
      pointer-events: none;
      z-index: 0;
    }

    header {
      position: relative;
      z-index: 10;
      padding: 18px 24px;
      border-bottom: 1px solid var(--border);
      display: flex;
      align-items: center;
      gap: 14px;
      background: rgba(10,10,15,0.95);
      backdrop-filter: blur(10px);
    }

    .logo {
      width: 40px; height: 40px;
      background: var(--accent);
      border-radius: 10px;
      display: flex; align-items: center; justify-content: center;
      font-size: 20px;
      box-shadow: 0 0 20px rgba(223, 95, 255, 0.4);
      animation: pulse 2.5s ease-in-out infinite;
    }

    @keyframes pulse {
      0%, 100% { box-shadow: 0 0 20px rgba(255, 22, 224, 0.4); }
      50% { box-shadow: 0 0 35px rgba(211, 37, 255, 0.7); }
    }

    .header-text h1 { font-size: 1.2rem; font-weight: 800; color: var(--accent); letter-spacing: -0.5px; }
    .header-text p { font-size: 0.72rem; color: var(--muted); font-family: 'Space Mono', monospace; }

    .status-dot {
      width: 8px; height: 8px;
      background: var(--accent);
      border-radius: 50%;
      margin-left: auto;
      animation: blink 1.5s ease-in-out infinite;
      box-shadow: 0 0 8px var(--accent);
    }

    @keyframes blink {
      0%, 100% { opacity: 1; }
      50% { opacity: 0.3; }
    }

    #chat {
      flex: 1;
      overflow-y: auto;
      padding: 24px 16px;
      display: flex;
      flex-direction: column;
      gap: 16px;
      position: relative;
      z-index: 1;
      scroll-behavior: smooth;
    }

    #chat::-webkit-scrollbar { width: 4px; }
    #chat::-webkit-scrollbar-track { background: transparent; }
    #chat::-webkit-scrollbar-thumb { background: var(--border); border-radius: 4px; }

    .message { max-width: 75%; animation: fadeUp 0.3s ease; }

    @keyframes fadeUp {
      from { opacity: 0; transform: translateY(10px); }
      to { opacity: 1; transform: translateY(0); }
    }

    .message.user { align-self: flex-end; }
    .message.bot { align-self: flex-start; }

    .bubble { padding: 12px 16px; border-radius: 16px; font-size: 0.92rem; line-height: 1.6; }

    .user .bubble {
      background: var(--user-bubble);
      border: 1px solid rgba(0,255,136,0.2);
      border-bottom-right-radius: 4px;
    }

    .bot .bubble {
      background: var(--bot-bubble);
      border: 1px solid var(--border);
      border-bottom-left-radius: 4px;
    }

    .label { font-size: 0.68rem; font-family: 'Space Mono', monospace; color: var(--muted); margin-bottom: 4px; padding: 0 4px; }
    .user .label { text-align: right; color: rgba(0,255,136,0.5); }

    .bubble a { color: var(--accent); text-decoration: none; border-bottom: 1px dashed var(--accent); transition: opacity 0.2s; }
    .bubble a:hover { opacity: 0.7; }

    .typing .bubble { display: flex; gap: 5px; align-items: center; padding: 14px 18px; }

    .dot { width: 7px; height: 7px; background: var(--accent); border-radius: 50%; animation: bounce 1.2s infinite; }
    .dot:nth-child(2) { animation-delay: 0.2s; background: var(--accent2); }
    .dot:nth-child(3) { animation-delay: 0.4s; }

    @keyframes bounce {
      0%, 80%, 100% { transform: translateY(0); opacity: 0.5; }
      40% { transform: translateY(-7px); opacity: 1; }
    }

    #input-area {
      position: relative;
      z-index: 10;
      padding: 14px 16px;
      border-top: 1px solid var(--border);
      background: rgba(10,10,15,0.97);
      backdrop-filter: blur(10px);
      display: flex;
      gap: 10px;
      align-items: flex-end;
    }

    #user-input {
      flex: 1;
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 12px;
      padding: 12px 16px;
      color: var(--text);
      font-family: 'Syne', sans-serif;
      font-size: 0.92rem;
      outline: none;
      resize: none;
      max-height: 120px;
      transition: border-color 0.2s;
      line-height: 1.5;
    }

    #user-input:focus { border-color: var(--accent); }
    #user-input::placeholder { color: var(--muted); }

    #send-btn {
      width: 46px; height: 46px;
      background: var(--accent);
      border: none;
      border-radius: 12px;
      cursor: pointer;
      display: flex; align-items: center; justify-content: center;
      font-size: 1.1rem;
      transition: all 0.2s;
      flex-shrink: 0;
      box-shadow: 0 0 15px rgba(0,255,136,0.3);
    }

    #send-btn:hover { background: #00e07a; box-shadow: 0 0 25px rgba(0,255,136,0.5); transform: scale(1.05); }

    #suggest-btn {
      width: 46px; height: 46px;
      background: var(--surface2);
      border: 1px solid var(--border);
      border-radius: 12px;
      cursor: pointer;
      display: flex; align-items: center; justify-content: center;
      font-size: 1.1rem;
      transition: all 0.2s;
      flex-shrink: 0;
    }
    #suggest-btn:hover { border-color: var(--accent); transform: scale(1.05); }
    #send-btn:disabled { background: var(--surface2); box-shadow: none; cursor: not-allowed; transform: none; }

    #suggestions { display: flex; gap: 8px; flex-wrap: wrap; padding: 0 16px 10px; position: relative; z-index: 10; }

    .chip {
      background: var(--surface2);
      border: 1px solid var(--border);
      border-radius: 20px;
      padding: 5px 12px;
      font-size: 0.75rem;
      color: var(--muted);
      cursor: pointer;
      transition: all 0.2s;
      font-family: 'Space Mono', monospace;
    }

    .chip:hover { border-color: var(--accent); color: var(--accent); }

    @media (max-width: 500px) { .message { max-width: 90%; } }

    #date-bar {
      display: flex; align-items: center; gap: 8px; flex-wrap: wrap;
      padding: 8px 16px; background: var(--surface2);
      border-bottom: 1px solid var(--border);
      position: relative; z-index: 10;
      font-size: 0.78rem; color: var(--muted);
      font-family: 'Space Mono', monospace;
    }
    #date-filter {
      background: var(--surface); border: 1px solid var(--border);
      border-radius: 8px; padding: 4px 8px; color: var(--text);
      font-family: 'Space Mono', monospace; font-size: 0.75rem;
      outline: none; cursor: pointer;
    }
    #date-filter:focus { border-color: var(--accent); }
    #date-bar button {
      background: transparent; border: 1px solid var(--border);
      border-radius: 8px; padding: 4px 10px; color: var(--muted);
      font-family: 'Space Mono', monospace; font-size: 0.72rem;
      cursor: pointer; transition: all 0.2s;
    }
    #date-bar button:hover { border-color: var(--accent2); color: var(--accent2); }
    #date-label { color: var(--accent); font-size: 0.72rem; }

    /* LOGIN */
    #login-screen {
      position: fixed; inset: 0; z-index: 999;
      background: var(--bg);
      display: flex; align-items: center; justify-content: center;
    }

    .login-box {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 20px;
      padding: 40px 32px;
      width: 100%; max-width: 360px;
      display: flex; flex-direction: column; align-items: center;
      gap: 12px;
      box-shadow: 0 0 40px rgba(0,255,136,0.1);
    }

    .login-logo { font-size: 2.5rem; }
    .login-title { font-size: 1.6rem; font-weight: 800; color: var(--accent); }
    .login-sub { font-size: 0.75rem; color: var(--muted); font-family: 'Space Mono', monospace; margin-top: -8px; }

    .login-tabs { display: flex; gap: 0; border: 1px solid var(--border); border-radius: 10px; overflow: hidden; width: 100%; margin-top: 8px; }
    .tab { flex: 1; padding: 8px; background: transparent; border: none; color: var(--muted); font-family: 'Syne', sans-serif; font-weight: 700; font-size: 0.85rem; cursor: pointer; transition: all 0.2s; }
    .tab.active { background: var(--accent); color: #000; }

    #login-form, #signup-form { width: 100%; display: flex; flex-direction: column; gap: 10px; }

    .auth-input {
      width: 100%; padding: 11px 14px;
      background: var(--surface2); border: 1px solid var(--border);
      border-radius: 10px; color: var(--text);
      font-family: 'Syne', sans-serif; font-size: 0.9rem; outline: none;
      transition: border-color 0.2s;
    }
    .auth-input:focus { border-color: var(--accent); }

    .auth-btn {
      width: 100%; padding: 12px;
      background: var(--accent); border: none; border-radius: 10px;
      color: #000; font-family: 'Syne', sans-serif; font-weight: 800;
      font-size: 0.95rem; cursor: pointer; transition: all 0.2s;
      margin-top: 4px;
    }
    .auth-btn:hover { background: #00e07a; }

    .auth-error { font-size: 0.78rem; color: var(--accent2); font-family: 'Space Mono', monospace; min-height: 16px; }

    #logout-btn {
      margin-left: 8px; background: transparent; border: 1px solid var(--border);
      border-radius: 8px; padding: 4px 10px; color: var(--muted);
      font-family: 'Space Mono', monospace; font-size: 0.68rem; cursor: pointer;
      transition: all 0.2s;
    }
    #logout-btn:hover { border-color: var(--accent2); color: var(--accent2); }
  </style>
</head>

<div id="login-screen">

  function escapeHtml(text) {
    return text.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
  }

  function formatText(text) {
    return text
      .replace(/\*\*(.*?)\*\*/g, '<strong>$1</strong>')
      .replace(/\*(.*?)\*/g, '<em>$1</em>')
      .replace(/\[([^\]]+)\]\((https?:\/\/[^\)]+)\)/g, '<a href="$2" target="_blank" rel="noopener">$1 ↗</a>')

  }

  async function sendMessage(text) {
    if (sendMessage._sending) return;

    const msg = (text || inputEl.value).trim();
    if (!msg) { sendMessage._sending = false; return; }
    
    inputEl.value = '';

    sendBtn.disabled = true;

    addUserMessage(msg);
    showTyping();

      await fetch(DISCORD_WEBHOOK, {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ content: discordMsg })
      });
      removeTyping();
      addBotMessage("✅ Sent to the owner! Thanks for the feedback! 🙌");
    } catch(e) {
      console.error("Discord error", e);
    }
  }

  function fillSuggest() {
    inputEl.value = `suggest:\nmessage: \ntype: idea / feedback / more links`;
    inputEl.style.height = 'auto';
    inputEl.style.height = Math.min(inputEl.scrollHeight, 120) + 'px';
    inputEl.focus();
    const pos = inputEl.value.indexOf('message: ') + 9;
    inputEl.setSelectionRange(pos, pos);
  }

  function filterByDate() {
    const date = document.getElementById('date-filter').value;
    if (!date) return;
    const label = document.getElementById('date-label');
    const matches = GAME_SITES.filter(s => s.date === date);
    if (matches.length === 0) {
      label.textContent = 'No links found for this date';
      addBotMessage(`😔 No links were added on **${date}**. Try a different date!`);
      return;
    }
    label.textContent = `${matches.length} site(s) found`;
    const list = matches.map(s =>
      `**${s.name}** (${s.links.length} links):\n${s.links.map(l => `[${l}](${l})`).join('\n')}`
    ).join('\n\n');
    addBotMessage(`🗓️ Links added on **${date}**:\n\n${list}`);
  }

  function clearDateFilter() {
    document.getElementById('date-filter').value = '';
    document.getElementById('date-label').textContent = '';
  }

  function sendChip(chip) { sendMessage(chip.textContent.trim()); }

  inputEl.addEventListener('input', () => {
    inputEl.style.height = 'auto';
    inputEl.style.height = Math.min(inputEl.scrollHeight, 120) + 'px';
  });

  inputEl.addEventListener('keydown', (e) => {
    if (e.key === 'Enter' && !e.shiftKey) {
      e.preventDefault();
      sendMessage();
    }
  });

  // ── AUTH ──────────────────────────────────────────────
  function getUsers() { try { return JSON.parse(localStorage.getItem('gamebot_users') || '{}'); } catch { return {}; } }
  function saveUsers(users) { localStorage.setItem('gamebot_users', JSON.stringify(users)); }
  function hashPass(pass) {
    let h = 0;
    for (let i = 0; i < pass.length; i++) h = (Math.imul(31, h) + pass.charCodeAt(i)) | 0;
    return h.toString(36);
  }

  function switchTab(tab, el) {
    document.querySelectorAll('.tab').forEach(t => t.classList.remove('active'));
    el.classList.add('active');
    document.getElementById('login-form').style.display = tab === 'login' ? 'flex' : 'none';
    document.getElementById('signup-form').style.display = tab === 'signup' ? 'flex' : 'none';
    document.getElementById('login-error').textContent = '';
    document.getElementById('signup-error').textContent = '';
  }

  function doLogin() {
    const username = document.getElementById('login-username').value.trim();
    const password = document.getElementById('login-password').value;
    const errEl = document.getElementById('login-error');
    if (!username || !password) { errEl.textContent = 'Fill in all fields!'; return; }
    const users = getUsers();
    if (!users[username]) { errEl.textContent = 'Account not found.'; return; }
    if (users[username] !== hashPass(password)) { errEl.textContent = 'Wrong password!'; return; }
    startSession(username);
  }

  function doSignup() {
    const username = document.getElementById('signup-username').value.trim();
    const password = document.getElementById('signup-password').value;
    const confirm = document.getElementById('signup-confirm').value;
    const errEl = document.getElementById('signup-error');
    if (!username || !password) { errEl.textContent = 'Fill in all fields!'; return; }
    if (password !== confirm) { errEl.textContent = "Passwords don't match!"; return; }
    if (password.length < 4) { errEl.textContent = 'Password too short (4+ chars)'; return; }
    if (username.length < 2) { errEl.textContent = 'Username too short!'; return; }
    const users = getUsers();
    if (users[username]) { errEl.textContent = 'Username already taken!'; return; }
    users[username] = hashPass(password);
    saveUsers(users);
    startSession(username);
  }

  function startSession(username) {
    localStorage.setItem('gamebot_session', username);
    document.getElementById('login-screen').style.display = 'none';
    document.getElementById('app').style.display = 'flex';
    document.getElementById('header-user').textContent = username;
    addBotMessage('Hey **' + username + '**! 👋 I\'m **GameBot** — tell me you\'re bored and I\'ll hook you up with the best game sites! 🎮');
  }

  function doLogout() {
    localStorage.removeItem('gamebot_session');
    document.getElementById('login-screen').style.display = 'flex';
    document.getElementById('app').style.display = 'none';
    clearChat();
    document.getElementById('login-username').value = '';
    document.getElementById('login-password').value = '';
    document.getElementById('login-error').textContent = '';
  }

  const existingSession = localStorage.getItem('gamebot_session');
  if (existingSession) { startSession(existingSession); }
</script>
